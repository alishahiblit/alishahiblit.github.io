<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ثبت نام | باشگاه استقلال</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(0, 100, 220, .20),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(0, 60, 160, .18),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #02050b,
                    #061426 50%,
                    #010308
                );

            padding: 30px 15px;
        }

        /* ---------------- HEADER ---------------- */

        .header {
            text-align: center;

            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 30px;

            margin-bottom: 8px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #72baff
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #8fa3b9;

            font-size: 14px;
        }

        /* ---------------- MAIN BOX ---------------- */

        .auth-box {

            width: 100%;

            max-width: 650px;

            margin: auto;

            padding: 35px;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(11, 29, 52, .94),
                    rgba(3, 10, 20, .96)
                );

            border: 1px solid
                rgba(80, 160, 255, .20);

            box-shadow:
                0 30px 90px
                rgba(0, 0, 0, .75),

                0 0 50px
                rgba(0, 80, 180, .10);

            backdrop-filter: blur(15px);

            position: relative;

            overflow: hidden;
        }

        .auth-box::before {

            content: "";

            position: absolute;

            top: 0;

            right: 10%;

            left: 10%;

            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #087cff,
                    #62b5ff,
                    #087cff,
                    transparent
                );

            box-shadow:
                0 0 20px #087cff;
        }

        /* ---------------- TABS ---------------- */

        .tabs {

            display: flex;

            gap: 8px;

            margin-bottom: 30px;
        }

        .tab {

            flex: 1;

            padding: 13px;

            border-radius: 12px;

            text-align: center;

            font-size: 14px;

            color: #8295aa;

            background:
                rgba(255, 255, 255, .035);

            border: 1px solid
                rgba(255, 255, 255, .06);
        }

        .tab.active {

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #075da9,
                    #06386d
                );

            border-color:
                rgba(70, 160, 255, .30);

            box-shadow:
                0 8px 25px
                rgba(0, 80, 180, .20);
        }

        /* ---------------- TITLE ---------------- */

        .form-title {

            font-size: 24px;

            margin-bottom: 8px;

            color: #ffffff;
        }

        .form-description {

            color: #788ca2;

            font-size: 13px;

            margin-bottom: 28px;
        }

        /* ---------------- FORM ---------------- */

        .content {

            display: flex;

            flex-direction: column;

            gap: 16px;
        }

        .row {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 14px;
        }

        .field {

            display: flex;

            flex-direction: column;

            gap: 8px;
        }

        .field label {

            font-size: 13px;

            color: #b9c8d8;
        }

        .field input {

            width: 100%;

            padding: 14px 15px;

            border-radius: 12px;

            outline: none;

            color: white;

            background:
                rgba(255, 255, 255, .035);

            border: 1px solid
                rgba(120, 160, 200, .13);

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            font-size: 13px;

            transition: .25s;
        }

        .field input::placeholder {
            color: #506276;
        }

        .field input:focus {

            border-color:
                rgba(50, 145, 255, .65);

            background:
                rgba(10, 50, 90, .25);

            box-shadow:
                0 0 0 3px
                rgba(0, 110, 255, .08);
        }

        /* ---------------- CHECKBOX ---------------- */

        .terms {

            display: flex;

            align-items: center;

            gap: 9px;

            margin-top: 4px;

            color: #73869b;

            font-size: 12px;

            line-height: 1.8;
        }

        .terms input {

            width: 16px;

            height: 16px;

            accent-color: #087cff;

            cursor: pointer;
        }

        .terms a {

            color: #4da8ff;

            text-decoration: none;
        }

        /* ---------------- BUTTON ---------------- */

        .main-btn {

            width: 100%;

            border: none;

            outline: none;

            cursor: pointer;

            padding: 16px;

            margin-top: 7px;

            border-radius: 13px;

            color: white;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            font-size: 15px;

            font-weight: bold;

            background:
                linear-gradient(
                    135deg,
                    #087cff,
                    #0752a0
                );

            border:
                1px solid
                rgba(120, 195, 255, .30);

            box-shadow:
                0 12px 30px
                rgba(0, 90, 210, .25);

            transition: .3s;
        }

        .main-btn:hover {

            transform:
                translateY(-2px);

            background:
                linear-gradient(
                    135deg,
                    #168bff,
                    #0861b7
                );

            box-shadow:
                0 16px 38px
                rgba(0, 105, 230, .40);
        }

        .main-btn:active {

            transform:
                translateY(0);
        }

        /* ---------------- GOOGLE ---------------- */

        .google-btn {

            width: 100%;

            padding: 14px;

            border-radius: 12px;

            background:
                rgba(255, 255, 255, .035);

            border:
                1px solid
                rgba(255, 255, 255, .08);

            color: #dce5ef;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            font-size: 13px;

            cursor: pointer;

            transition: .25s;
        }

        .google-btn:hover {

            background:
                rgba(255, 255, 255, .07);

            border-color:
                rgba(255, 255, 255, .15);
        }

        /* ---------------- DIVIDER ---------------- */

        .divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 5px 0;
        }

        .divider::before,
        .divider::after {

            content: "";

            height: 1px;

            flex: 1;

            background:
                rgba(255, 255, 255, .07);
        }

        .divider span {

            color: #53677c;

            font-size: 11px;
        }

        /* ---------------- LOGIN ---------------- */

        .login-text {

            text-align: center;

            color: #64788e;

            font-size: 12px;

            margin-top: 5px;
        }

        .login-text a {

            color: #55aaff;

            text-decoration: none;

            font-weight: bold;
        }

        /* ---------------- MOBILE ---------------- */

        @media (max-width: 600px) {

            body {
                padding: 18px 12px;
            }

            .header h1 {
                font-size: 25px;
            }

            .auth-box {
                padding: 25px 18px;
                border-radius: 22px;
            }

            .form-title {
                font-size: 21px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .field input {
                padding: 13px;
            }
        }

        @media (max-width: 380px) {

            .header h1 {
                font-size: 22px;
            }

            .auth-box {
                padding: 22px 14px;
            }

            .tabs {
                gap: 5px;
            }

            .tab {
                padding: 11px 5px;
            }
        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <h1>
            باشگاه استقلال
        </h1>

        <p>
            سامانه خرید بلیت مسابقات فوتبال
        </p>

    </header>



    <!-- AUTH BOX -->

    <main class="auth-box">


        <!-- TABS -->

        <div class="tabs">

            <div class="tab">
                ورود
            </div>

            <div class="tab active">
                ثبت نام
            </div>

        </div>



        <h2 class="form-title">
            به استقلال خوش آمدید!
        </h2>

        <p class="form-description">
            برای ایجاد حساب کاربری اطلاعات زیر را وارد کنید.
        </p>



        <!-- FORM -->

        <form
            class="content"
            onsubmit="
                event.preventDefault();
                window.location.href='welcome.html';
            "
        >


            <!-- NAME -->

            <div class="row">

                <div class="field">

                    <label>
                        نام
                    </label>

                    <input
                        type="text"
                        placeholder="نام خود را وارد کنید"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        نام خانوادگی
                    </label>

                    <input
                        type="text"
                        placeholder="نام خانوادگی"
                        required
                    >

                </div>

            </div>



            <!-- PHONE / NATIONAL CODE -->

            <div class="row">

                <div class="field">

                    <label>
                        شماره موبایل
                    </label>

                    <input
                        type="tel"
                        placeholder="09123456789"
                        pattern="09[0-9]{9}"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        کد ملی
                    </label>

                    <input
                        type="text"
                        placeholder="کد ملی ۱۰ رقمی"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        required
                    >

                </div>

            </div>



            <!-- EMAIL / BIRTHDAY -->

            <div class="row">

                <div class="field">

                    <label>
                        ایمیل
                    </label>

                    <input
                        type="email"
                        placeholder="example@gmail.com"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        تاریخ تولد
                    </label>

                    <input
                        type="text"
                        placeholder="۱۴۰۰/۰۱/۰۱"
                        required
                    >

                </div>

            </div>



            <!-- PASSWORD -->

            <div class="field">

                <label>
                    رمز عبور
                </label>

                <input
                    type="password"
                    placeholder="حداقل ۸ کاراکتر"
                    minlength="8"
                    required
                >

            </div>



            <!-- TERMS -->

            <label class="terms">

                <input
                    type="checkbox"
                    required
                >

                <span>
                    قوانین و شرایط سامانه را می‌پذیرم.
                    <a href="#">
                        مشاهده قوانین
                    </a>
                </span>

            </label>



            <!-- REGISTER BUTTON -->

            <button
                class="main-btn"
                type="submit"
            >

                ثبت نام
                <span>
                    ♙+
                </span>

            </button>



            <!-- DIVIDER -->

            <div class="divider">

                <span>
                    یا
                </span>

            </div>



            <!-- GOOGLE -->

            <button
                class="google-btn"
                type="button"
            >

                ادامه با Google

            </button>



            <!-- LOGIN -->

            <p class="login-text">

                قبلاً حساب دارید؟

                <a href="#">
                    ورود به حساب
                </a>

            </p>


        </form>

    </main>


</body>

</html>
