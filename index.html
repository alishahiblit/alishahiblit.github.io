<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>باشگاه استقلال | ورود و ثبت نام</title>


    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            width: 100%;
            min-height: 100%;
        }


        body {
            width: 100%;
            min-height: 100vh;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            color: #ffffff;

            background:
                radial-gradient(
                    circle at 85% 5%,
                    rgba(0, 119, 255, 0.30),
                    transparent 32%
                ),

                radial-gradient(
                    circle at 5% 90%,
                    rgba(0, 80, 200, 0.22),
                    transparent 35%
                ),

                linear-gradient(
                    145deg,
                    #020918 0%,
                    #031a42 50%,
                    #020817 100%
                );

            overflow-x: hidden;
        }


        /* =========================
           BACKGROUND LIGHT
        ========================= */

        body::before {
            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    125deg,
                    transparent 30%,
                    rgba(0, 110, 255, 0.07) 50%,
                    transparent 70%
                );
        }


        /* =========================
           PAGE
        ========================= */

        .page {
            width: 100%;
            min-height: 100vh;

            padding:
                50px
                20px
                40px;

            display: flex;

            flex-direction: column;

            align-items: center;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            width: 100%;

            max-width: 650px;

            text-align: center;

            margin-bottom: 28px;
        }


        .header h1 {
            font-size:
                clamp(
                    28px,
                    5vw,
                    42px
                );

            font-weight: 800;

            line-height: 1.5;

            text-shadow:
                0 0 20px
                rgba(
                    0,
                    120,
                    255,
                    0.35
                );
        }


        .header p {
            margin-top: 7px;

            color: #159cff;

            font-size:
                clamp(
                    14px,
                    2.5vw,
                    20px
                );

            line-height: 1.8;
        }


        /* =========================
           AUTH BOX
        ========================= */

        .auth-box {
            width: 100%;

            max-width: 650px;

            padding: 17px;

            border-radius: 26px;

            border:
                1px solid
                rgba(
                    0,
                    149,
                    255,
                    0.75
                );

            background:
                rgba(
                    2,
                    25,
                    65,
                    0.78
                );

            box-shadow:

                0 0 30px
                rgba(
                    0,
                    102,
                    255,
                    0.22
                ),

                inset 0 0 30px
                rgba(
                    0,
                    102,
                    255,
                    0.08
                );

            backdrop-filter: blur(18px);

            -webkit-backdrop-filter: blur(18px);
        }


        /* =========================
           TABS
        ========================= */

        .tabs {
            width: 100%;

            height: 65px;

            display: flex;

            direction: rtl;

            padding: 3px;

            border-radius: 17px;

            background:
                rgba(
                    0,
                    47,
                    115,
                    0.45
                );

            border:
                1px solid
                rgba(
                    0,
                    125,
                    255,
                    0.5
                );
        }


        .tab {
            width: 50%;

            height: 100%;

            border: none;

            border-radius: 14px;

            background: transparent;

            color: #a9c9ef;

            font-family: inherit;

            font-size: 17px;

            cursor: pointer;
        }


        .tab.active {
            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #087dff,
                    #1464e9
                );

            box-shadow:
                0 0 18px
                rgba(
                    0,
                    111,
                    255,
                    0.40
                );
        }


        /* =========================
           FORM
        ========================= */

        .content {
            width: 100%;

            padding:
                34px
                8px
                8px;
        }


        .content h2 {
            text-align: center;

            font-size:
                clamp(
                    23px,
                    5vw,
                    30px
                );

            font-weight: 800;

            line-height: 1.6;

            margin-bottom: 8px;
        }


        .description {
            text-align: center;

            color: #6694c8;

            font-size:
                clamp(
                    12px,
                    2.5vw,
                    14px
                );

            line-height: 1.9;

            margin-bottom: 28px;
        }


        /* =========================
           INPUT BOX
        ========================= */

        .input-box {
            width: 100%;

            min-height: 68px;

            display: flex;

            align-items: center;

            direction: ltr;

            gap: 12px;

            padding:
                8px
                16px;

            margin-bottom: 13px;

            border-radius: 17px;

            border:
                1px solid
                rgba(
                    0,
                    132,
                    255,
                    0.58
                );

            background:
                rgba(
                    1,
                    32,
                    78,
                    0.68
                );

            transition:
                0.25s;
        }


        .input-box:focus-within {
            border-color: #119aff;

            box-shadow:
                0 0 17px
                rgba(
                    0,
                    126,
                    255,
                    0.20
                );
        }


        /* =========================
           ICON
        ========================= */

        .icon {
            width: 32px;

            min-width: 32px;

            text-align: center;

            color: #a9d8ff;

            font-size: 22px;
        }


        /* =========================
           INPUT CONTENT
        ========================= */

        .input-content {
            flex: 1;

            min-width: 0;

            direction: rtl;
        }


        .input-content label {
            display: block;

            color: #d5e7ff;

            font-size: 12px;

            margin-bottom: 3px;
        }


        .input-content input {
            width: 100%;

            height: 25px;

            border: none;

            outline: none;

            background: transparent;

            color: #ffffff;

            font-family: inherit;

            font-size: 14px;

            text-align: right;
        }


        .input-content input::placeholder {
            color: #5f87bb;
        }


        /* =========================
           VALIDATION
        ========================= */

        .input-content input:invalid:not(:placeholder-shown) {
            border-bottom:
                1px solid
                #ff5577;
        }


        .input-content input:valid:not(:placeholder-shown) {
            border-bottom:
                1px solid
                rgba(
                    0,
                    220,
                    150,
                    0.5
                );
        }


        /* =========================
           TERMS
        ========================= */

        .terms {
            width: 100%;

            display: flex;

            align-items: center;

            gap: 8px;

            color: #b7cce5;

            font-size:
                clamp(
                    11px,
                    2.5vw,
                    13px
                );

            line-height: 1.8;

            margin:
                20px
                3px;

            cursor: pointer;
        }


        .terms input {
            width: 18px;

            height: 18px;

            flex-shrink: 0;

            accent-color: #087dff;

            cursor: pointer;
        }


        .terms b {
            color: #079cff;
        }


        /* =========================
           SUBMIT BUTTON
        ========================= */

        .main-btn {
            width: 100%;

            height: 61px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            border: none;

            border-radius: 17px;

            color: #ffffff;

            background:
                linear-gradient(
                    110deg,
                    #087bff,
                    #0758e8
                );

            font-family: inherit;

            font-size:
                clamp(
                    16px,
                    3.5vw,
                    20px
                );

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 7px 25px
                rgba(
                    0,
                    100,
                    255,
                    0.30
                );

            transition:
                0.2s;
        }


        .main-btn:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 10px 30px
                rgba(
                    0,
                    119,
                    255,
                    0.45
                );
        }


        .main-btn:active {
            transform:
                translateY(0);
        }


        .main-btn strong {
            font-size: 24px;

            font-weight: 400;
        }


        /* =========================
           OR
        ========================= */

        .or {
            width: 100%;

            display: flex;

            align-items: center;

            gap: 15px;

            margin:
                25px
                0;

            color: #adc5e2;
        }


        .or span {
            flex: 1;

            height: 1px;

            background:
                rgba(
                    110,
                    160,
                    220,
                    0.25
                );
        }


        .or b {
            font-size: 14px;

            font-weight: 400;
        }


        /* =========================
           GOOGLE BUTTON
        ========================= */

        .google-btn {
            width: 100%;

            height: 57px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 16px;

            border:
                1px solid
                rgba(
                    0,
                    129,
                    255,
                    0.55
                );

            background:
                rgba(
                    2,
                    28,
                    68,
                    0.55
                );

            color: #dceaff;

            font-family: inherit;

            font-size:
                clamp(
                    14px,
                    3vw,
                    17px
                );

            cursor: pointer;
        }


        .google {
            margin-left: 12px;

            font-family: Arial, sans-serif;

            font-size: 24px;

            font-weight: bold;

            color: #4285f4;
        }


        /* =========================
           LOGIN
        ========================= */

        .login-text {
            text-align: center;

            color: #8ba9ca;

            font-size:
                clamp(
                    12px,
                    2.5vw,
                    14px
                );

            margin-top: 25px;

            line-height: 1.8;
        }


        .login-text a {
            color: #0798ff;

            text-decoration: none;

            font-weight: 700;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .page {
                min-height: 100svh;

                padding:
                    25px
                    10px
                    30px;
            }


            .header {
                margin-bottom: 20px;
            }


            .header h1 {
                font-size: 28px;
            }


            .header p {
                font-size: 14px;
            }


            .auth-box {
                padding: 10px;

                border-radius: 21px;
            }


            .tabs {
                height: 57px;

                border-radius: 15px;
            }


            .tab {
                font-size: 14px;
            }


            .content {
                padding:
                    25px
                    3px
                    5px;
            }


            .content h2 {
                font-size: 23px;
            }


            .description {
                font-size: 12px;

                margin-bottom: 22px;
            }


            .input-box {
                min-height: 63px;

                padding:
                    7px
                    12px;

                border-radius: 15px;

                gap: 7px;
            }


            .icon {
                width: 28px;

                min-width: 28px;

                font-size: 20px;
            }


            .input-content label {
                font-size: 11px;
            }


            .input-content input {
                height: 23px;

                font-size: 12px;
            }


            .terms {
                font-size: 11px;

                margin:
                    18px
                    2px;
            }


            .main-btn {
                height: 56px;

                border-radius: 15px;

                font-size: 17px;
            }


            .google-btn {
                height: 53px;

                border-radius: 15px;

                font-size: 14px;
            }


            .login-text {
                font-size: 12px;
            }
        }


        /* =========================
           SMALL PHONES
        ========================= */

        @media (max-width: 380px) {

            .page {
                padding:
                    20px
                    7px
                    25px;
            }


            .header h1 {
                font-size: 25px;
            }


            .header p {
                font-size: 12px;
            }


            .auth-box {
                padding: 8px;

                border-radius: 19px;
            }


            .tabs {
                height: 53px;
            }


            .content h2 {
                font-size: 21px;
            }


            .description {
                font-size: 11px;
            }


            .input-box {
                min-height: 59px;

                padding:
                    7px
                    9px;
            }


            .input-content input {
                font-size: 11px;
            }


            .terms {
                font-size: 10px;

                gap: 6px;
            }


            .terms input {
                width: 16px;

                height: 16px;
            }


            .main-btn {
                height: 53px;

                font-size: 15px;
            }


            .google-btn {
                height: 50px;

                font-size: 13px;
            }
        }

    </style>

</head>


<body>


    <main class="page">


        <!-- =========================
             HEADER
        ========================== -->

        <header class="header">

            <h1>
                باشگاه استقلال
            </h1>

            <p>
                سامانه خرید بلیت مسابقات فوتبال
            </p>

        </header>



        <!-- =========================
             AUTH BOX
        ========================== -->

        <section class="auth-box">


            <!-- TABS -->

            <div class="tabs">

                <button
                    class="tab active"
                    type="button"
                >
                    ورود
                    <span>♙</span>
                </button>


                <button
                    class="tab"
                    type="button"
                >
                    ثبت نام
                    <span>♙+</span>
                </button>

            </div>



            <!-- =========================
                 FORM
            ========================== -->

            <form
                class="content"
                action="#"
                method="post"
            >


                <h2>
                    به استقلال خوش آمدید!
                </h2>


                <p class="description">
                    برای ثبت نام، اطلاعات خود را وارد کنید.
                </p>



                <!-- =====================
                     PHONE
                ====================== -->

                <div class="input-box">

                    <div class="icon">
                        ▣
                    </div>

                    <div class="input-content">

                        <label for="phone">
                            شماره موبایل
                        </label>

                        <input
                            id="phone"
                            name="phone"
                            type="tel"
                            inputmode="numeric"
                            placeholder="09xxxxxxxxx"
                            pattern="09[0-9]{9}"
                            title="شماره موبایل باید با 09 شروع شود و 11 رقم باشد."
                            required
                        >

                    </div>

                </div>



                <!-- =====================
                     PASSWORD
                ====================== -->

                <div class="input-box">

                    <div class="icon">
                        ◉
                    </div>

                    <div class="input-content">

                        <label for="password">
                            رمز عبور
                        </label>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            placeholder="حداقل ۸ کاراکتر"
                            minlength="8"
                            required
                        >

                    </div>

                </div>



                <!-- =====================
                     NATIONAL CODE
                ====================== -->

                <div class="input-box">

                    <div class="icon">
                        ▣
                    </div>

                    <div class="input-content">

                        <label for="national-code">
                            کد ملی
                        </label>

                        <input
                            id="national-code"
                            name="national-code"
                            type="text"
                            inputmode="numeric"
                            placeholder="کد ملی خود را وارد کنید"
                            pattern="[0-9]{10}"
                            title="کد ملی باید 10 رقم باشد."
                            required
                        >

                    </div>

                </div>



                <!-- =====================
                     FIRST NAME
                ====================== -->

                <div class="input-box">

                    <div class="icon">
                        ♙
                    </div>

                    <div class="input-content">

                        <label for="first-name">
                            نام
                        </label>

                        <input
                            id="first-name"
                            name="first-name"
                            type="text"
                            placeholder="نام خود را وارد کنید"
                            required
                        >

                    </div>

                </div>



                <!-- =====================
                     LAST NAME
                ====================== -->

                <div class="input-box">

                    <div class="icon">
                        ♙
                    </div>

                    <div class="input-content">

                        <label for="last-name">
                            نام خانوادگی
                        </label>

                        <input
                            id="last-name"
                            name="last-name"
                            type="text"
                            placeholder="نام خانوادگی خود را وارد کنید"
                            required
                        >

                    </div>

                </div>



                <!-- =====================
                     BIRTHDAY
                ====================== -->

                <div class="input-box">

                    <div class="icon">
                        □
                    </div>

                    <div class="input-content">

                        <label for="birthday">
                            تاریخ تولد
                        </label>

                        <input
                            id="birthday"
                            name="birthday"
                            type="text"
                            placeholder="مثال: ۱۳۷۰/۰۱/۰۱"
                            required
                        >

                    </div>

                </div>



                <!-- =====================
                     EMAIL
                ====================== -->

                <div class="input-box">

                    <div class="icon">
                        ✉
                    </div>

                    <div class="input-content">

                        <label for="email">
                            ایمیل
                        </label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            placeholder="example@gmail.com"
                            title="لطفاً یک ایمیل معتبر وارد کنید."
                            required
                        >

                    </div>

                </div>



                <!-- =====================
                     TERMS
                ====================== -->

                <label class="terms">

                    <input
                        type="checkbox"
                        name="terms"
                        required
                    >

                    <span>

                        با

                        <b>
                            قوانین و مقررات
                        </b>

                        باشگاه استقلال موافقم.

                    </span>

                </label>



                <!-- =====================
                     SUBMIT
                ====================== -->

                <button
                    class="main-btn"
                    type="submit"
                >

                    <span>
                        ثبت نام
                    </span>

                    <strong>
                        ♙+
                    </strong>

                </button>



                <!-- =====================
                     OR
                ====================== -->

                <div class="or">

                    <span></span>

                    <b>
                        یا
                    </b>

                    <span></span>

                </div>



                <!-- =====================
                     GOOGLE
                ====================== -->

                <button
                    class="google-btn"
                    type="button"
                >

                    <span class="google">
                        G
                    </span>

                    <span>
                        ثبت نام با گوگل
                    </span>

                </button>



                <!-- =====================
                     LOGIN
                ====================== -->

                <p class="login-text">

                    حساب کاربری دارید؟

                    <a href="#">
                        وارد شوید
                    </a>

                </p>


            </form>

        </section>


    </main>


</body>

                        </html>
