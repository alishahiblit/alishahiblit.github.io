<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>باشگاه استقلال | ورود و ثبت نام</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(0, 110, 255, 0.25), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(0, 70, 180, 0.25), transparent 30%),
                linear-gradient(135deg, #020817, #061936, #020b1d);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 27px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .header p {
            font-size: 14px;
            color: #9fb4d3;
        }

        .auth-box {
            width: 100%;
            background: rgba(10, 28, 55, 0.75);
            border: 1px solid rgba(120, 170, 230, 0.18);
            border-radius: 25px;
            padding: 30px;
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(18px);
        }

        .tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 5px;
            margin-bottom: 28px;
        }

        .tab {
            width: 50%;
            padding: 12px;
            text-align: center;
            border-radius: 10px;
            color: #9fb4d3;
            font-size: 15px;
        }

        .tab.active {
            background: #1268d8;
            color: white;
            box-shadow: 0 5px 20px rgba(18, 104, 216, 0.3);
        }

        .content h2 {
            font-size: 23px;
            margin-bottom: 8px;
        }

        .content .subtitle {
            color: #91a6c5;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 17px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            font-size: 13px;
            color: #c8d7ea;
        }

        .field input {
            width: 100%;
            height: 48px;
            border-radius: 12px;
            border: 1px solid rgba(130, 170, 220, 0.2);
            background: rgba(2, 12, 28, 0.75);
            color: white;
            padding: 0 15px;
            outline: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .field input::placeholder {
            color: #61738e;
        }

        .field input:focus {
            border-color: #2784ff;
            box-shadow: 0 0 0 3px rgba(39, 132, 255, 0.12);
        }

        .field input:invalid:not(:placeholder-shown) {
            border-color: #e05252;
        }

        .field input:valid:not(:placeholder-shown) {
            border-color: rgba(50, 190, 130, 0.45);
        }

        .terms {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 22px 0;
            color: #9fb4d3;
            font-size: 12px;
        }

        .terms input {
            width: 17px;
            height: 17px;
            accent-color: #1673e6;
        }

        .main-btn {
            width: 100%;
            height: 53px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(135deg, #1477ed, #0750b5);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(15, 105, 220, 0.3);
            transition: 0.2s;
        }

        .main-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 35px rgba(15, 105, 220, 0.4);
        }

        .main-btn strong {
            margin-right: 8px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 23px 0;
            color: #647894;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: rgba(150, 180, 220, 0.12);
        }

        .google-btn {
            width: 100%;
            height: 48px;
            border-radius: 12px;
            border: 1px solid rgba(130, 170, 220, 0.18);
            background: rgba(255, 255, 255, 0.045);
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .login-text {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #8195b1;
        }

        .login-text a {
            color: #3990ff;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
                align-items: flex-start;
            }

            .container {
                margin-top: 10px;
            }

            .auth-box {
                padding: 22px 17px;
                border-radius: 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .header p {
                font-size: 12px;
            }

            .content h2 {
                font-size: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .field.full {
                grid-column: auto;
            }
        }

        @media (max-width: 380px) {
            .auth-box {
                padding: 18px 13px;
            }

            .header h1 {
                font-size: 20px;
            }

            .content h2 {
                font-size: 18px;
            }

            .field input {
                height: 45px;
            }

            .main-btn {
                height: 50px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>باشگاه استقلال</h1>
            <p>سامانه خرید بلیت مسابقات فوتبال</p>
        </div>

        <div class="auth-box">

            <div class="tabs">
                <div class="tab">ورود</div>
                <div class="tab active">ثبت نام</div>
            </div>

            <form class="content" action="#" method="post">

                <h2>به استقلال خوش آمدید!</h2>

                <p class="subtitle">
                    برای ایجاد حساب کاربری، اطلاعات زیر را وارد کنید.
                </p>

                <div class="form-grid">

                    <div class="field">
                        <label for="firstName">نام</label>
                        <input
                            id="firstName"
                            name="firstName"
                            type="text"
                            placeholder="نام خود را وارد کنید"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="lastName">نام خانوادگی</label>
                        <input
                            id="lastName"
                            name="lastName"
                            type="text"
                            placeholder="نام خانوادگی"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="phone">شماره موبایل</label>
                        <input
                            id="phone"
                            name="phone"
                            type="tel"
                            inputmode="numeric"
                            placeholder="09123456789"
                            pattern="09[0-9]{9}"
                            title="شماره موبایل باید با 09 شروع شود و 11 رقم باشد."
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="nationalCode">کد ملی</label>
                        <input
                            id="nationalCode"
                            name="nationalCode"
                            type="text"
                            inputmode="numeric"
                            placeholder="کد ملی 10 رقمی"
                            pattern="[0-9]{10}"
                            title="کد ملی باید دقیقاً 10 رقم باشد."
                            required
                        >
                    </div>

                    <div class="field full">
                        <label for="email">ایمیل</label>
                        <input
                            id="email"
                            name="email"
                            type="email"
                            placeholder="example@gmail.com"
                            title="لطفاً یک ایمیل معتبر وارد کنید."
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="birthDate">تاریخ تولد</label>
                        <input
                            id="birthDate"
                            name="birthDate"
                            type="text"
                            placeholder="مثلاً 1389/11/11"
                            pattern="[0-9]{4}/[0-9]{2}/[0-9]{2}"
                            title="تاریخ را به شکل 1389/11/11 وارد کنید."
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="password">رمز عبور</label>
                        <input
                            id="password"
                            name="password"
                            type="password"
                            placeholder="حداقل 8 کاراکتر"
                            minlength="8"
                            required
                        >
                    </div>

                </div>

                <label class="terms">
                    <input type="checkbox" required>
                    <span>
                        با قوانین و مقررات باشگاه استقلال موافقم.
                    </span>
                </label>

                <button class="main-btn" type="submit">
                    <span>ثبت نام</span>
                    <strong>♙+</strong>
                </button>

                <div class="divider">
                    یا
                </div>

                <button class="google-btn" type="button">
                    ادامه با Google
                </button>

                <p class="login-text">
                    قبلاً حساب کاربری دارید؟
                    <a href="#">وارد شوید</a>
                </p>

            </form>

        </div>

    </div>

</body>
                          </html>
