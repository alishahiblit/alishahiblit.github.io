<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>خوش آمدید | باشگاه استقلال</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;
            color: white;

            background:
                radial-gradient(circle at 20% 20%, rgba(0, 110, 255, .25), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(0, 70, 180, .2), transparent 35%),
                linear-gradient(135deg, #01040a, #061a31, #01040a);

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 700px;
            padding: 45px 30px;
            text-align: center;

            background: rgba(5, 18, 35, .92);
            border: 1px solid rgba(70, 160, 255, .25);
            border-radius: 28px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, .8),
                0 0 50px rgba(0, 100, 255, .12);
        }

        .check {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 45px;

            background: linear-gradient(135deg, #087cff, #063b78);
            box-shadow: 0 0 40px rgba(0, 120, 255, .4);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;

            background: linear-gradient(90deg, #fff, #5eb3ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #9eb0c3;
            line-height: 2;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .card {
            padding: 20px 10px;
            border-radius: 15px;

            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(255, 255, 255, .07);
        }

        .card span {
            display: block;
            font-size: 25px;
            margin-bottom: 10px;
        }

        .card strong {
            font-size: 13px;
        }

        .btn {
            display: inline-block;
            padding: 15px 35px;

            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;

            border-radius: 13px;

            background: linear-gradient(135deg, #087cff, #0752a0);

            box-shadow: 0 12px 30px rgba(0, 90, 210, .3);
        }

        @media (max-width: 600px) {
            .box {
                padding: 35px 18px;
            }

            h1 {
                font-size: 25px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .check {
                width: 75px;
                height: 75px;
                font-size: 35px;
            }
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="check">✓</div>

        <h1>شما وارد شدید!</h1>

        <p>
            به سامانه خرید بلیت بازی‌های استقلال تهران خوش آمدید.
            <br>
            حساب کاربری شما با موفقیت ایجاد شد.
        </p>

        <div class="cards">

            <div class="card">
                <span>⚽</span>
                <strong>مسابقات استقلال</strong>
            </div>

            <div class="card">
                <span>🎟️</span>
                <strong>خرید بلیت</strong>
            </div>

            <div class="card">
                <span>🏟️</span>
                <strong>ورزشگاه</strong>
            </div>

        </div>

        <a class="btn" href="./index.html">
            بازگشت به صفحه اصلی
        </a>

    </div>

</body>
</html>
