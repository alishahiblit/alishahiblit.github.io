<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>خوش آمدید | استقلال</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
            overflow: hidden;

            background:
                radial-gradient(circle at 15% 20%, rgba(0, 102, 255, .22), transparent 30%),
                radial-gradient(circle at 90% 85%, rgba(0, 55, 150, .28), transparent 35%),
                linear-gradient(135deg, #02050b 0%, #061325 48%, #010307 100%);
        }

        /* خطوط تزئینی پس زمینه */

        body::before {
            content: "";
            position: fixed;
            width: 650px;
            height: 650px;
            border: 1px solid rgba(45, 135, 255, .12);
            border-radius: 50%;
            top: -330px;
            left: -180px;
            box-shadow:
                0 0 0 70px rgba(30, 110, 220, .025),
                0 0 0 140px rgba(30, 110, 220, .018);
        }

        body::after {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            border: 1px solid rgba(30, 120, 255, .1);
            border-radius: 50%;
            bottom: -280px;
            right: -180px;
        }

        .box {
            width: 100%;
            max-width: 720px;

            position: relative;

            padding: 48px;

            border-radius: 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(12, 28, 52, .94),
                    rgba(3, 10, 20, .96)
                );

            border: 1px solid rgba(80, 160, 255, .22);

            box-shadow:
                0 30px 100px rgba(0, 0, 0, .8),
                0 0 60px rgba(0, 75, 180, .12);

            overflow: hidden;
        }

        /* نور بالای کارت */

        .box::before {
            content: "";
            position: absolute;

            top: 0;
            right: 8%;
            left: 8%;

            height: 3px;

            background: linear-gradient(
                90deg,
                transparent,
                #087cff,
                #62b5ff,
                #087cff,
                transparent
            );

            box-shadow: 0 0 25px #087cff;
        }

        /* دایره نور گوشه */

        .box::after {
            content: "";
            position: absolute;

            width: 250px;
            height: 250px;

            background: rgba(0, 100, 255, .08);

            border-radius: 50%;

            filter: blur(70px);

            top: -130px;
            right: -100px;

            pointer-events: none;
        }

        .top {
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .check {
            width: 92px;
            height: 92px;

            margin: 0 auto 25px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            font-size: 42px;
            font-weight: bold;

            color: #fff;

            background:
                linear-gradient(
                    145deg,
                    #087cff,
                    #063c83
                );

            border: 2px solid rgba(130, 195, 255, .5);

            box-shadow:
                0 0 35px rgba(0, 110, 255, .4),
                inset 0 0 25px rgba(255, 255, 255, .1);

            animation: pulse 2.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow:
                    0 0 30px rgba(0, 110, 255, .35),
                    inset 0 0 20px rgba(255, 255, 255, .08);
            }

            50% {
                box-shadow:
                    0 0 55px rgba(0, 120, 255, .55),
                    inset 0 0 25px rgba(255, 255, 255, .13);
            }
        }

        h1 {
            font-size: 34px;
            margin-bottom: 14px;

            background: linear-gradient(
                90deg,
                #fff,
                #8fc9ff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-text {
            color: #aebed1;
            font-size: 16px;
            line-height: 2;
        }

        .highlight {
            color: #51aaff;
            font-weight: bold;
        }

        /* خط جداکننده */

        .line {
            width: 100%;
            height: 1px;

            margin: 32px 0;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(80, 160, 255, .3),
                transparent
            );
        }

        /* کارت های امکانات */

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;

            position: relative;
            z-index: 2;
        }

        .card {
            min-height: 125px;

            padding: 20px 12px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            border-radius: 19px;

            background:
                linear-gradient(
                    145deg,
                    rgba(19, 48, 82, .7),
                    rgba(5, 16, 30, .8)
                );

            border: 1px solid rgba(90, 160, 235, .14);

            transition: .3s ease;

            cursor: default;
        }

        .card:hover {
            transform: translateY(-6px);

            border-color: rgba(60, 155, 255, .45);

            background:
                linear-gradient(
                    145deg,
                    rgba(18, 72, 125, .75),
                    rgba(5, 20, 38, .9)
                );

            box-shadow:
                0 15px 35px rgba(0, 80, 180, .2);
        }

        .icon {
            width: 52px;
            height: 52px;

            display: flex;
            justify-content: center;
            align-items: center;

            margin-bottom: 12px;

            border-radius: 15px;

            font-size: 25px;

            background: rgba(0, 105, 220, .13);

            border: 1px solid rgba(70, 155, 240, .16);
        }

        .card strong {
            font-size: 13px;
            color: #e5edf7;
        }

        .card small {
            margin-top: 6px;
            font-size: 11px;
            color: #72869d;
        }

        /* دکمه */

        .button-area {
            margin-top: 30px;

            display: flex;
            justify-content: center;
        }

        .back-btn {
            width: 240px;

            padding: 15px 20px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            color: white;
            text-decoration: none;

            border-radius: 14px;

            font-size: 14px;
            font-weight: bold;

            background:
                linear-gradient(
                    135deg,
                    #087cff,
                    #0753a2
                );

            border: 1px solid rgba(120, 190, 255, .35);

            box-shadow:
                0 12px 30px rgba(0, 90, 200, .25);

            transition: .3s;
        }

        .back-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 17px 40px rgba(0, 100, 230, .4);

            background:
                linear-gradient(
                    135deg,
                    #1689ff,
                    #0861b8
                );
        }

        .footer {
            text-align: center;

            margin-top: 23px;

            color: #52657b;

            font-size: 11px;
        }

        /* موبایل */

        @media (max-width: 600px) {

            body {
                padding: 14px;
                overflow-y: auto;
            }

            .box {
                padding: 35px 20px;
                border-radius: 24px;
            }

            h1 {
                font-size: 27px;
            }

            .welcome-text {
                font-size: 14px;
            }

            .check {
                width: 78px;
                height: 78px;
                font-size: 35px;
            }

            .cards {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .card {
                min-height: 90px;
                flex-direction: row;
                justify-content: flex-start;
                text-align: right;
                padding: 13px 17px;
            }

            .icon {
                margin: 0 0 0 15px;
                flex-shrink: 0;
            }

            .card small {
                display: block;
            }

            .back-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="top">

            <div class="check">
                ✓
            </div>

            <h1>
                شما وارد شدید!
            </h1>

            <p class="welcome-text">
                به سامانه خرید بلیت بازی‌های
                <span class="highlight">استقلال تهران</span>
                خوش آمدید.
                <br>
                ثبت‌نام شما با موفقیت انجام شد.
            </p>

        </div>


        <div class="line"></div>


        <div class="cards">

            <div class="card">

                <div class="icon">
                    ⚽
                </div>

                <div>
                    <strong>مسابقات استقلال</strong>
                    <small>مشاهده بازی‌ها</small>
                </div>

            </div>


            <div class="card">

                <div class="icon">
                    🎟️
                </div>

                <div>
                    <strong>خرید بلیت</strong>
                    <small>تهیه بلیت مسابقات</small>
                </div>

            </div>


            <div class="card">

                <div class="icon">
                    🏟️
                </div>

                <div>
                    <strong>ورزشگاه</strong>
                    <small>اطلاعات مسابقه</small>
                </div>

            </div>

        </div>


        <div class="button-area">

            <a href="index.html" class="back-btn">
                ← بازگشت به صفحه اصلی
            </a>

        </div>


        <div class="footer">
            سامانه خرید بلیت مسابقات فوتبال استقلال
        </div>

    </div>

</body>
</html>
